        content:
          application/json:
            schema:
              type: object
              properties:
                to_user_id:
                  type: integer
                  description: ID of the user to transfer ownership to
              required:
              - to_user_id
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Ownership transferred successfully
                type: object
                properties:
                  message:
                    type: string
                  from_user:
                    type: string
                  to_user:
                    type: string
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Bad request - invalid user or transfer not allowed
                type: object
                properties:
                  error:
                    type: string
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Forbidden - only owners can transfer ownership
                type: object
                properties:
                  error:
                    type: string
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: User not found
                type: object
                properties:
                  error:
                    type: string
          description: ''
