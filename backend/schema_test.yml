openapi: 3.0.3
info:
  title: DjangoCRM API
  version: 1.0.0
  description: "\n    Multi-tenant Customer Relationship Management (CRM) system API.\n\
    \n    This API provides comprehensive tools for managing:\n    - **Tenants**:\
    \ Multi-tenant organization management\n    - **Clients**: Customer relationship\
    \ management\n    - **Projects**: Project lifecycle management with milestones\
    \ and tasks\n    - **Invoices & Payments**: Financial management and billing\n\
    \    - **Users & Teams**: User management and role-based access control\n\n  \
    \  ## Authentication\n    - Use `Authorization: Token <token>` header for API\
    \ requests\n    - Obtain tokens via `/api/login/` or `/api/signup/` endpoints\n\
    \    - Session authentication is also supported for web users\n\n    ## Multi-tenancy\n\
    \    In production with multi-tenancy enabled, all data is automatically scoped\
    \ to the current tenant based on the request context.\n    "
  contact:
    name: DjangoCRM Support
    email: support@djangocrm.com
  license:
    name: MIT License
paths:
  /api/accounts/audit-logs/:
    get:
      operationId: accounts_audit_logs_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - admin_user_activated
          - admin_user_suspended
          - bulk_invitation_completed
          - bulk_invitation_started
          - invitation_cancelled
          - invitation_confirmed
          - invitation_expired
          - invitation_sent
          - invitation_used
          - member_approved
          - member_rejected
          - project_created
          - role_assigned
          - role_created
          - role_updated
          - security_failed_login
          - security_token_misuse
          - user_login
          - user_logout
          - user_password_change
          - user_profile_update
          - user_signup
        description: |-
          * `user_signup` - User Signup
          * `user_login` - User Login
          * `user_logout` - User Logout
          * `user_profile_update` - Profile Update
          * `user_password_change` - Password Change
          * `invitation_sent` - Invitation Sent
          * `invitation_confirmed` - Invitation Confirmed
          * `invitation_used` - Invitation Used
          * `invitation_cancelled` - Invitation Cancelled
          * `invitation_expired` - Invitation Expired
          * `member_approved` - Member Approved
          * `member_rejected` - Member Rejected
          * `role_created` - Role Created
          * `role_updated` - Role Updated
          * `role_assigned` - Role Assigned
          * `project_created` - Project Created
          * `bulk_invitation_started` - Bulk Invitation Started
          * `bulk_invitation_completed` - Bulk Invitation Completed
          * `security_failed_login` - Failed Login Attempt
          * `security_token_misuse` - Token Misuse
          * `admin_user_suspended` - User Suspended
          * `admin_user_activated` - User Activated
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: resource_type
        schema:
          type: string
          enum:
          - bulk_invitation
          - invitation
          - profile
          - role
          - tenant
          - user
        description: |-
          * `user` - User
          * `invitation` - Invitation
          * `role` - Role
          * `tenant` - Tenant
          * `profile` - User Profile
          * `bulk_invitation` - Bulk Invitation
      - in: query
        name: tenant
        schema:
          type: string
          format: uuid
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/accounts/documents/:
    get:
      operationId: accounts_documents_list
      description: List and create employee documents
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmployeeDocumentList'
          description: ''
    post:
      operationId: accounts_documents_create
      description: List and create employee documents
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeDocument'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeDocument'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeDocument'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDocument'
          description: ''
  /api/accounts/documents/{id}/:
    get:
      operationId: accounts_documents_retrieve
      description: Retrieve, update, delete employee documents
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDocument'
          description: ''
    put:
      operationId: accounts_documents_update
      description: Retrieve, update, delete employee documents
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeDocument'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeDocument'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeDocument'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDocument'
          description: ''
    patch:
      operationId: accounts_documents_partial_update
      description: Retrieve, update, delete employee documents
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeDocument'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeDocument'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeDocument'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDocument'
          description: ''
    delete:
      operationId: accounts_documents_destroy
      description: Retrieve, update, delete employee documents
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/accounts/profile/:
    get:
      operationId: accounts_profile_retrieve
      description: Get and update user profile
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    put:
      operationId: accounts_profile_update
      description: Get and update user profile
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfile'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: accounts_profile_partial_update
      description: Get and update user profile
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/approve-member/:
    post:
      operationId: approve_member_create
      description: Approve a pending member request and assign appropriate group permissions.
      summary: Approve tenant member
      tags:
      - approve-member
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
              required:
              - user_id
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Member approved successfully
                type: object
                properties:
                  message:
                    type: string
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Permission denied
                type: object
                properties:
                  error:
                    type: string
          description: ''
  /api/assign-admin/:
    post:
      operationId: assign_admin_create
      description: Assign or remove admin (owner) role to/from an approved tenant
        member. Only current owners can perform this action.
      summary: Assign admin role to tenant member
      tags:
      - assign-admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: ID of the user to assign/remove admin role
                assign_admin:
                  type: boolean
                  description: True to assign admin role, False to remove
              required:
              - user_id
              - assign_admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Admin role assigned/removed successfully
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: string
                  role:
                    type: string
                  is_owner:
                    type: boolean
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Bad request - invalid user or assignment not allowed
                type: object
                properties:
                  error:
                    type: string
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Forbidden - only owners can assign admin roles
                type: object
                properties:
                  error:
                    type: string
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: User not found
                type: object
                properties:
                  error:
                    type: string
          description: ''
  /api/auth-methods/:
    get:
      operationId: auth_methods_retrieve
      description: Returns information about supported authentication methods and
        providers.
      summary: Get available authentication methods
      tags:
      - auth-methods
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Authentication methods information
                type: object
                properties:
                  traditional:
                    type: object
                    properties:
                      endpoint:
                        type: string
                      method:
                        type: string
                      description:
                        type: string
                      fields:
                        type: array
                        items:
                          type: string
                  oauth:
                    type: object
                    properties:
                      providers:
                        type: object
                        properties:
                          google:
                            type: object
                            properties:
                              login_url:
                                type: string
                              description:
                                type: string
                          github:
                            type: object
                            properties:
                              login_url:
                                type: string
                              description:
                                type: string
          description: ''
  /api/clients/:
    get:
      operationId: clients_list
      description: Retrieve a list of clients for the current tenant.
      summary: List clients
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - inactive
          - prospect
        description: |-
          * `active` - Active
          * `inactive` - Inactive
          * `prospect` - Prospect
      tags:
      - clients
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientList'
          description: ''
    post:
      operationId: clients_create
      description: Create a new client for the current tenant.
      summary: Create client
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Client'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Client'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Client'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
  /api/clients/{slug}/:
    get:
      operationId: clients_retrieve
      description: Retrieve details of a specific client.
      summary: Retrieve client
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - clients
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
    put:
      operationId: clients_update
      description: Update an existing client's information.
      summary: Update client
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Client'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Client'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Client'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
    patch:
      operationId: clients_partial_update
      description: Partially update a client's information.
      summary: Partially update client
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClient'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClient'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClient'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
    delete:
      operationId: clients_destroy
      description: Delete a client.
      summary: Delete client
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - clients
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/clients/bulk_delete_clients/:
    post:
      operationId: clients_bulk_delete_clients_create
      description: |-
        Bulk delete multiple clients.
        Expects: {"client_ids": [1, 2, 3]}
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Client'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Client'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Client'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
  /api/confirm-invitation/:
    get:
      operationId: confirm_invitation_retrieve
      description: Confirm invitation email by marking the invitation as email_confirmed.
        This endpoint is called when a user clicks the confirmation link in their
        email.
      summary: Confirm invitation email
      parameters:
      - in: query
        name: token
        schema:
          type: string
        description: Invitation token (for GET requests)
      tags:
      - confirm-invitation
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  invitation:
                    type: object
                    properties:
                      email:
                        type: string
                      tenant_name:
                        type: string
                      role:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
          description: ''
    post:
      operationId: confirm_invitation_create
      description: Confirm invitation email by marking the invitation as email_confirmed.
        This endpoint is called when a user clicks the confirmation link in their
        email.
      summary: Confirm invitation email
      parameters:
      - in: query
        name: token
        schema:
          type: string
        description: Invitation token (for GET requests)
      tags:
      - confirm-invitation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Invitation token
              required:
              - token
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  invitation:
                    type: object
                    properties:
                      email:
                        type: string
                      tenant_name:
                        type: string
                      role:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
          description: ''
  /api/database-backup/:
    post:
      operationId: database_backup_create
      description: Create a timestamped database backup. Only superusers can perform
        this action.
      summary: Create database backup
      tags:
      - database-backup
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Backup created successfully
                type: object
                properties:
                  message:
                    type: string
                  backup_file:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  size:
                    type: string
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Forbidden - only superusers can create backups
                type: object
                properties:
                  error:
                    type: string
          description: ''
  /api/excel-export/:
    get:
      operationId: excel_export_retrieve
      description: Export clients, projects, or tasks to Excel format
      summary: Export data to Excel
      parameters:
      - in: query
        name: model
        schema:
          type: string
          enum:
          - clients
          - projects
          - tasks
        description: Model to export (clients, projects, tasks)
        required: true
      tags:
      - excel-export
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Excel file download
                content:
                  application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
                    schema:
                      type: string
                      format: binary
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Invalid model type
                type: object
                properties:
                  error:
                    type: string
          description: ''
  /api/excel-import/:
    post:
      operationId: excel_import_create
      description: Import clients, projects, or tasks from Excel file
      summary: Import data from Excel
      tags:
      - excel-import
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Excel file to import
                model:
                  type: string
                  enum:
                  - clients
                  - projects
                  - tasks
                  description: Model type to import
              required:
              - file
              - model
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Import completed
                type: object
                properties:
                  imported:
                    type: integer
                  updated:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: string
                  warnings:
                    type: array
                    items:
                      type: string
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Invalid request or file format
                type: object
                properties:
                  error:
                    type: string
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: Health check endpoint for monitoring service availability
      tags:
      - health
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
          description: ''
  /api/invitations/:
    get:
      operationId: invitations_list
      description: Retrieve a list of invitations sent by the current tenant.
      summary: List invitations
      parameters:
      - in: query
        name: is_used
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: tenant
        schema:
          type: string
          format: uuid
      tags:
      - invitations
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvitationList'
          description: ''
    post:
      operationId: invitations_create
      description: Create a new invitation to join the tenant.
      summary: Create invitation
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invitation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Invitation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Invitation'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
  /api/invitations/{slug}/:
    get:
      operationId: invitations_retrieve
      description: Retrieve details of a specific invitation.
