      type: object
      description: Serializer for leave balances with utilization calculations.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          nullable: true
          pattern: ^[-a-zA-Z0-9_]+$
        employee:
          type: integer
          description: Employee whose leave balance this represents
        employee_name:
          type: string
          readOnly: true
          description: Full name of the employee
        tenant:
          type: string
          format: uuid
          description: Company/tenant the balance belongs to
        tenant_name:
          type: string
          readOnly: true
          description: Name of the tenant organization
        leave_type:
          allOf:
          - $ref: '#/components/schemas/LeaveTypeEnum'
          description: |-
            Type of leave this balance applies to

            * `annual_leave` - Annual Leave
            * `sick_leave` - Sick Leave
            * `personal_leave` - Personal Leave
            * `maternity_leave` - Maternity/Paternity Leave
            * `emergency_leave` - Emergency Leave
            * `unpaid_leave` - Unpaid Leave
        year:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Calendar year for this leave balance
        total_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          description: Total leave days allocated for this year
        used_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          description: Days already used this year
        carried_over:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          description: Days carried over from previous year
        remaining_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          readOnly: true
          description: Remaining leave days available
        utilization_percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          readOnly: true
          description: Leave utilization percentage
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - employee
      - employee_name
      - id
      - leave_type
      - remaining_days
      - slug
      - tenant
      - tenant_name
      - total_days
      - updated_at
      - utilization_percentage
      - year
    LeavePolicy:
      type: object
      description: Serializer for leave policies with validation.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          nullable: true
          pattern: ^[-a-zA-Z0-9_]+$
        tenant:
          type: string
          format: uuid
          description: Company/tenant this policy applies to
        tenant_name:
          type: string
          readOnly: true
          description: Name of the tenant organization
        leave_type:
          allOf:
          - $ref: '#/components/schemas/LeaveTypeEnum'
          description: |-
            Type of leave this policy applies to

            * `annual_leave` - Annual Leave
            * `sick_leave` - Sick Leave
            * `personal_leave` - Personal Leave
            * `maternity_leave` - Maternity/Paternity Leave
            * `emergency_leave` - Emergency Leave
            * `unpaid_leave` - Unpaid Leave
        annual_entitlement:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          description: Default annual leave entitlement in days
        max_consecutive_days:
          type: integer
          maximum: 365
          minimum: 1
          description: Maximum consecutive days allowed for this leave type
        notice_period_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Minimum notice period required in working days
        carry_over_allowed:
          type: boolean
          description: Whether unused leave can be carried over to next year
        max_carry_over:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          nullable: true
          description: Maximum days that can be carried over (null = unlimited)
        auto_approve_max_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
          nullable: true
          description: Maximum days that can be auto-approved (null = no auto-approval)
        is_active:
          type: boolean
          description: Whether this policy is currently active
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
