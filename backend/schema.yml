        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: parent_department
        schema:
          type: string
          format: uuid
      - in: query
        name: tenant
        schema:
          type: string
          format: uuid
      tags:
      - accounts
      security:
      - JWTAuthentication: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepartmentList'
          description: ''
    post:
      operationId: accounts_departments_create
