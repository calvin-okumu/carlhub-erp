components:
  schemas:
    AccountTypeEnum:
      enum:
      - checking
      - savings
      type: string
      description: |-
        * `checking` - Checking
        * `savings` - Savings
    ActionEnum:
      enum:
      - user_signup
      - user_login
      - user_logout
      - user_profile_update
      - user_password_change
      - invitation_sent
      - invitation_confirmed
      - invitation_used
      - invitation_cancelled
      - invitation_expired
      - member_approved
      - member_rejected
      - role_created
      - role_updated
      - role_assigned
      - project_created
      - bulk_invitation_started
      - bulk_invitation_completed
      - security_failed_login
      - security_token_misuse
      - admin_user_suspended
      - admin_user_activated
      type: string
      description: |-
        * `user_signup` - User Signup
        * `user_login` - User Login
        * `user_logout` - User Logout
        * `user_profile_update` - Profile Update
        * `user_password_change` - Password Change
        * `invitation_sent` - Invitation Sent
        * `invitation_confirmed` - Invitation Confirmed
        * `invitation_used` - Invitation Used
        * `invitation_cancelled` - Invitation Cancelled
        * `invitation_expired` - Invitation Expired
        * `member_approved` - Member Approved
        * `member_rejected` - Member Rejected
        * `role_created` - Role Created
        * `role_updated` - Role Updated
        * `role_assigned` - Role Assigned
        * `project_created` - Project Created
        * `bulk_invitation_started` - Bulk Invitation Started
        * `bulk_invitation_completed` - Bulk Invitation Completed
        * `security_failed_login` - Failed Login Attempt
        * `security_token_misuse` - Token Misuse
        * `admin_user_suspended` - User Suspended
        * `admin_user_activated` - User Activated
    ApprovalLevelsEnum:
      enum:
      - department_manager
      - department_manager,hr_manager
      - department_manager,hr_manager,general_manager
      - hr_manager
      - hr_manager,general_manager
      - general_manager
      - custom
      type: string
      description: |-
        * `department_manager` - Department Manager Only
        * `department_manager,hr_manager` - Department Manager → HR Manager
        * `department_manager,hr_manager,general_manager` - Department Manager → HR Manager → General Manager
        * `hr_manager` - HR Manager Only
        * `hr_manager,general_manager` - HR Manager → General Manager
        * `general_manager` - General Manager Only
        * `custom` - Custom Approval Chain
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        resource_type:
          $ref: '#/components/schemas/ResourceTypeEnum'
        resource_id:
          type: string
          nullable: true
          maxLength: 255
        old_values:
          nullable: true
        new_values:
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        metadata:
          nullable: true
        user_email:
          type: string
          readOnly: true
        tenant_name:
          type: string
          readOnly: true
      required:
      - action
      - id
      - resource_type
      - tenant_name
      - timestamp
      - user_email
    BackupResponse:
      type: object
      description: Serializer for backup database response
      properties:
        message:
          type: string
        backup_file:
          type: string
        timestamp:
          type: string
          format: date-time
        size:
          type: string
      required:
      - backup_file
      - message
      - size
      - timestamp
    BlankEnum:
      enum:
      - ''
    CategoryEnum:
      enum:
      - project
      - leave
      - crm
      - finance
      - admin
      - custom
      type: string
      description: |-
        * `project` - Project Management
        * `leave` - Leave Management
        * `crm` - CRM
        * `finance` - Finance
        * `admin` - Administration
        * `custom` - Custom
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          pattern: ^\+?1?\d{9,15}$
          maxLength: 20
        status:
          $ref: '#/components/schemas/ClientStatusEnum'
        tenant:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        tenant_name:
          type: string
          readOnly: true
          description: Name of the tenant organization
        projects_count:
          type: integer
          readOnly: true
          description: Number of projects associated with this client
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - name
      - projects_count
      - tenant
      - tenant_name
      - updated_at
    ClientStatusEnum:
      enum:
      - active
      - inactive
      - prospect
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `prospect` - Prospect
    CompanySizeEnum:
      enum:
      - 1-10
      - 11-50
      - 51-200
      - 201-1000
      - 1000+
      type: string
      description: |-
        * `1-10` - 1-10 employees
        * `11-50` - 11-50 employees
        * `51-200` - 51-200 employees
        * `201-1000` - 201-1000 employees
        * `1000+` - 1000+ employees
    CurrencyEnum:
      enum:
      - USD
      - EUR
      - GBP
      - JPY
      - CAD
      - AUD
      - CHF
      - CNY
      - INR
      - BRL
      - ZAR
      - KES
      type: string
      description: |-
        * `USD` - US Dollar ($)
        * `EUR` - Euro (€)
        * `GBP` - British Pound (£)
        * `JPY` - Japanese Yen (¥)
        * `CAD` - Canadian Dollar (C$)
        * `AUD` - Australian Dollar (A$)
        * `CHF` - Swiss Franc (CHF)
        * `CNY` - Chinese Yuan (¥)
        * `INR` - Indian Rupee (₹)
        * `BRL` - Brazilian Real (R$)
        * `ZAR` - South African Rand (R)
        * `KES` - Kenyan Shilling (KSh)
    CurrentApprovalLevelEnum:
      enum:
      - department_manager
      - hr_manager
      - general_manager
      type: string
      description: |-
        * `department_manager` - Department Manager
        * `hr_manager` - HR Manager
        * `general_manager` - General Manager
    CustomPermission:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          nullable: true
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 255
        codename:
          type: string
          maxLength: 100
        description:
          type: string
        category:
          $ref: '#/components/schemas/CategoryEnum'
        app_label:
          type: string
          maxLength: 100
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - codename
      - created_at
      - id
      - name
      - slug
      - updated_at
    CustomUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        first_name:
          type: string
