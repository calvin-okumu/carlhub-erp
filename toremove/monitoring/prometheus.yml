global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: '/metrics'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6380']
    metrics_path: '/metrics'

  # Shared PostgreSQL instance
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # Services (will be added as they are implemented)
  # - job_name: 'identity-service'
  #   static_configs:
  #     - targets: ['identity-service:8001']
  #   metrics_path: '/metrics/'
  #   scrape_interval: 5s