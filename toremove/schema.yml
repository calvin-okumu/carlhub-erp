        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this invoice.
        required: true
      tags:
      - accounting
      security:
      - JWTAuthentication: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
