          type: string
        timestamp:
          type: string
          format: date-time
        size:
          type: string
      required:
      - backup_file
      - message
      - size
      - timestamp
    BlankEnum:
      enum:
      - ''
    CategoryEnum:
      enum:
      - project
      - leave
      - crm
      - finance
      - admin
      - custom
      type: string
      description: |-
        * `project` - Project Management
        * `leave` - Leave Management
        * `crm` - CRM
        * `finance` - Finance
        * `admin` - Administration
        * `custom` - Custom
