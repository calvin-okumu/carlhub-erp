  /api/accounting/payments/:
    get:
      operationId: accounting_payments_list
      description: Retrieve a list of payments for current tenant.
      summary: List payments
      parameters:
      - in: query
        name: client
        schema:
          type: string
          format: uuid
      - in: query
        name: currency
        schema:
          type: string
          nullable: true
          enum:
          - AUD
          - BRL
          - CAD
          - CHF
          - CNY
          - EUR
          - GBP
          - INR
          - JPY
          - KES
          - USD
          - ZAR
        description: |-
          Currency for this payment

          * `USD` - US Dollar ($)
          * `EUR` - Euro (€)
          * `GBP` - British Pound (£)
          * `JPY` - Japanese Yen (¥)
          * `CAD` - Canadian Dollar (C$)
          * `AUD` - Australian Dollar (A$)
          * `CHF` - Swiss Franc (CHF)
          * `CNY` - Chinese Yuan (¥)
          * `INR` - Indian Rupee (₹)
          * `BRL` - Brazilian Real (R$)
          * `ZAR` - South African Rand (R)
          * `KES` - Kenyan Shilling (KSh)
      - in: query
        name: invoice
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: paid_at
        schema:
          type: string
          format: date-time
      - in: query
        name: payment_method
        schema:
          type: string
          enum:
          - bank_transfer
          - cash
          - check
          - credit_card
          - debit_card
          - online
          - other
        description: |-
          * `bank_transfer` - Bank Transfer
          * `credit_card` - Credit Card
          * `debit_card` - Debit Card
          * `cash` - Cash
          * `check` - Check
          * `online` - Online Payment
          * `other` - Other
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - accounting
      security:
      - JWTAuthentication: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentSummaryList'
          description: ''
    post:
      operationId: accounting_payments_create
      description: Record a new payment for an invoice.
      summary: Create payment
