openapi: 3.0.3
info:
  title: DjangoCRM API
  version: 1.0.0
  description: "\n    Multi-tenant Customer Relationship Management (CRM) system API.\n\
    \n    This API provides comprehensive tools for managing:\n    - **Tenants**:\
    \ Multi-tenant organization management\n    - **Clients**: Customer relationship\
    \ management\n    - **Projects**: Project lifecycle management with milestones\
    \ and tasks\n    - **Invoices & Payments**: Financial management and billing\n\
    \    - **Users & Teams**: User management and role-based access control\n\n  \
    \  ## Authentication\n    - Use `Authorization: Bearer <token>` header for API\
    \ requests (recommended)\n    - `Authorization: Token <token>` is deprecated but\
    \ still supported\n    - Obtain tokens via `/api/login/` or `/api/signup/` endpoints\n\
    \    - Session authentication is also supported for web users\n\n    ## Multi-tenancy\n\
    \    In production with multi-tenancy enabled, all data is automatically scoped\
    \ to the current tenant based on the request context.\n    "
  contact:
    name: DjangoCRM Support
    email: support@djangocrm.com
  license:
    name: MIT License
paths:
  /api/accounting/invoices/:
    get:
      operationId: accounting_invoices_list
      description: Retrieve a list of invoices for current tenant.
      summary: List invoices
      parameters:
      - in: query
        name: client
        schema:
          type: string
          format: uuid
      - in: query
        name: due_date
        schema:
          type: string
          format: date
      - in: query
        name: issued_at
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - draft
          - overdue
          - paid
          - sent
        description: |-
          * `draft` - Draft
          * `sent` - Sent
          * `paid` - Paid
          * `overdue` - Overdue
          * `cancelled` - Cancelled
      tags:
      - accounting
      security:
      - JWTAuthentication: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvoiceSummaryList'
          description: ''
    post:
      operationId: accounting_invoices_create
      description: Create a new invoice for a client/project.
      summary: Create invoice
      tags:
      - accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invoice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Invoice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Invoice'
        required: true
      security:
      - JWTAuthentication: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
          description: ''
  /api/accounting/invoices/{id}/:
    get:
      operationId: accounting_invoices_retrieve
