# Traefik Dynamic Configuration
# Service routers and middlewares for local microservices

# Identity Service
[http.routers.identity]
  rule = "PathPrefix(`/api/v1/identity`)"
  service = "identity"

[http.services.identity]
  [[http.services.identity.loadBalancer.servers]]
    url = "http://localhost:8001"

# Audit Service
[http.routers.audit]
  rule = "PathPrefix(`/api/v1/audit`)"
  service = "audit"

[http.services.audit]
  [[http.services.audit.loadBalancer.servers]]
    url = "http://localhost:8002"

