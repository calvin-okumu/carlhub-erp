# Traefik v3 Dynamic Configuration

# ==============================================
# API Middlewares - ReplacePathRegex for API routing
# /api/v1/identity/health/ -> /api/v1/health/
# ==============================================
[http.middlewares.identity-rewrite.replacePathRegex]
  regex = "^/api/v1/identity(/.*)$$"
  replacement = "/api/v1$1"

[http.middlewares.audit-rewrite.replacePathRegex]
  regex = "^/api/v1/audit(/.*)$$"
  replacement = "/api/v1$1"

[http.middlewares.notification-rewrite.replacePathRegex]
  regex = "^/api/v1/notification(/.*)$$"
  replacement = "/api/v1$1"

[http.middlewares.accounting-rewrite.replacePathRegex]
  regex = "^/api/v1/accounting(/.*)$$"
  replacement = "/api/v1$1"

[http.middlewares.hr-rewrite.replacePathRegex]
  regex = "^/api/v1/hr(/.*)$$"
  replacement = "/api/v1$1"

[http.middlewares.project-rewrite.replacePathRegex]
  regex = "^/api/v1/project(/.*)$$"
  replacement = "/api/v1$1"

[http.middlewares.sales-rewrite.replacePathRegex]
  regex = "^/api/v1/sales(/.*)$$"
  replacement = "/api/v1$1"

# ==============================================
# Swagger Root Routers - EXACT path match, HIGHEST PRIORITY
# Routes to project service (most comprehensive API)
# Must come BEFORE service-specific routers
# ==============================================
[http.middlewares.swagger-root.replacePathRegex]
  regex = "^/api/(swagger|docs|schema)/?$"
  replacement = "/api/$1"

[http.routers.swagger-root]
  rule = "Path(`/api/swagger`) || Path(`/api/docs`) || Path(`/api/schema`)"
  service = "project"
  middlewares = ["swagger-root"]

# ==============================================
# API Routers - API routing through gateway
# Access API: http://localhost:8000/api/v1/{service}/
# ==============================================
[http.routers.api-identity]
    rule = "PathPrefix(`/api/v1/identity`)"
    service = "identity"
    middlewares = ["identity-rewrite"]

[http.routers.api-audit]
    rule = "PathPrefix(`/api/v1/audit`)"
    service = "audit"
    middlewares = ["audit-rewrite"]

[http.routers.api-notification]
    rule = "PathPrefix(`/api/v1/notification`)"
    service = "notification"
    middlewares = ["notification-rewrite"]

[http.routers.api-accounting]
    rule = "PathPrefix(`/api/v1/accounting`)"
    service = "accounting"
    middlewares = ["accounting-rewrite"]

[http.routers.api-hr]
    rule = "PathPrefix(`/api/v1/hr`)"
    service = "hr"
    middlewares = ["hr-rewrite"]

[http.routers.api-project]
    rule = "PathPrefix(`/api/v1/project`)"
    service = "project"
    middlewares = ["project-rewrite"]

[http.routers.api-sales]
  rule = "PathPrefix(`/api/v1/sales`)"
  service = "sales"
  middlewares = ["sales-rewrite"]

# ==============================================
# Swagger Routers - Service-specific Swagger UI routing
# Access Swagger UI: http://localhost:8000/swagger/{service}/swagger/
# ==============================================
[http.routers.swagger-identity]
  rule = "PathPrefix(`/swagger/identity`)"
  service = "identity"
  middlewares = ["identity-swagger"]

[http.routers.swagger-audit]
  rule = "PathPrefix(`/swagger/audit`)"
  service = "audit"
  middlewares = ["audit-swagger"]

[http.routers.swagger-notification]
  rule = "PathPrefix(`/swagger/notification`)"
  service = "notification"
  middlewares = ["notification-swagger"]

[http.routers.swagger-accounting]
  rule = "PathPrefix(`/swagger/accounting`)"
  service = "accounting"
  middlewares = ["accounting-swagger"]

[http.routers.swagger-hr]
  rule = "PathPrefix(`/swagger/hr`)"
  service = "hr"
  middlewares = ["hr-swagger"]

[http.routers.swagger-project]
  rule = "PathPrefix(`/swagger/project`)"
  service = "project"
  middlewares = ["project-swagger"]

[http.routers.swagger-sales]
  rule = "PathPrefix(`/swagger/sales`)"
  service = "sales"
  middlewares = ["sales-swagger"]

# ==============================================
# Docs Routers - ReDoc UI routing
# Access ReDoc UI: http://localhost:8000/docs/{service}/docs/
# ==============================================
[http.routers.docs-identity]
  rule = "PathPrefix(`/docs/identity`)"
  service = "identity"
  middlewares = ["identity-docs"]

[http.routers.docs-audit]
  rule = "PathPrefix(`/docs/audit`)"
  service = "audit"
  middlewares = ["audit-docs"]

[http.routers.docs-notification]
  rule = "PathPrefix(`/docs/notification`)"
  service = "notification"
  middlewares = ["notification-docs"]

[http.routers.docs-accounting]
  rule = "PathPrefix(`/docs/accounting`)"
  service = "accounting"
  middlewares = ["accounting-docs"]

[http.routers.docs-hr]
  rule = "PathPrefix(`/docs/hr`)"
  service = "hr"
  middlewares = ["hr-docs"]

[http.routers.docs-project]
  rule = "PathPrefix(`/docs/project`)"
  service = "project"
  middlewares = ["project-docs"]

[http.routers.docs-sales]
  rule = "PathPrefix(`/docs/sales`)"
  service = "sales"
  middlewares = ["sales-docs"]

# ==============================================
# Admin Routers - Path-based routing for admin interfaces
# Currently commented out - uncomment to enable
# Access via: http://localhost:8000/admin/{service}/
# ==============================================
[http.routers.admin-identity]
  rule = "Host(`admin.identity.localhost`)"
  service = "identity"

