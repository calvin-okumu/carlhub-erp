# Health Check Router
[http.routers.health]
  rule = "PathPrefix(`/health`)"
  service = "health-all"

[http.services.health-all]
  [[http.services.health-all.loadBalancer.servers]]
    url = "http://localhost:8001"  # Default to identity service
